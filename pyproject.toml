[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-nn"
version = "1.0.0"
description = "An AI Neural Network Assistant with STT, TTS, and memory capabilities"
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "llama-cpp-python>=0.1.78",
    "faster-whisper>=0.5.0",
    "pyaudio>=0.2.11",
    "numpy>=1.21.0",
    "noisereduce>=2.0.0",
    "sentence-transformers>=2.2.2",
    "torch>=1.13.0",
    "sounddevice>=0.4.6",
    "librosa>=0.9.2",
    "transformers>=4.27.0",
    "huggingface-hub>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/your-repo/ai_nn"
Repository = "https://github.com/your-repo/ai_nn"

[project.scripts]
ai-nn = "ai_nn.ai_nn:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ai_nn"]